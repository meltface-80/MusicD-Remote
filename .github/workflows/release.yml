name: Create Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(jq -r .version package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Check if release already exists
        id: check
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" --repo ${{ github.repository }} > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build tarball
        id: tarball
        if: steps.check.outputs.exists == 'false'
        run: |
          VERSION=${{ steps.version.outputs.version }}
          TARBALL="/tmp/MusicD-Remote-v${VERSION}.tar.gz"
          tar -czf "$TARBALL" \
            --exclude='./.git' \
            --exclude='./node_modules' \
            --exclude='./old' \
            --exclude='./data' \
            --exclude='./*.tar.gz' \
            .
          echo "path=$TARBALL" >> $GITHUB_OUTPUT

      - name: Extract changelog section
        id: notes
        if: steps.check.outputs.exists == 'false'
        run: |
          VERSION=${{ steps.version.outputs.version }}
          # Print the lines BETWEEN this version's "## [x.y.z]" heading and the
          # next "## [" heading. The previous awk range (/^## \[$VERSION\]/,/^## \[/)
          # always returned just the heading itself — a range whose end pattern
          # also matches its start line collapses to that single line — which the
          # head/tail trim then reduced to nothing, so every release shipped with
          # empty notes. index($0,...)==1 anchors the match without the version's
          # dots being treated as regex wildcards.
          NOTES=$(awk -v ver="$VERSION" '
            !found && index($0, "## [" ver "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;};/\n$/ba')
          if [ -z "$NOTES" ]; then
            NOTES="See CHANGELOG.md for the changes in v$VERSION."
          fi
          # Written to a FILE, not a step output interpolated into the release
          # command: changelog entries contain backticks (`search`, `docker logs`)
          # which a double-quoted --notes argument would execute as command
          # substitution. --notes-file passes the text through untouched.
          # NOTE: never write a literal expression-interpolation token in this
          # file, even inside a shell comment — Actions evaluates them anywhere
          # in the workflow and an invalid one fails the whole run at startup.
          printf '%s\n' "$NOTES" > /tmp/release-notes.md
          echo "--- release notes ---"; cat /tmp/release-notes.md

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          TARBALL="${{ steps.tarball.outputs.path }}"
          if [ -n "$TARBALL" ] && [ -f "$TARBALL" ]; then
            gh release create "$TAG" "$TARBALL" \
              --title "MusicD Remote $TAG" \
              --notes-file /tmp/release-notes.md \
              --prerelease
          else
            gh release create "$TAG" \
              --title "MusicD Remote $TAG" \
              --notes-file /tmp/release-notes.md \
              --prerelease
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The image for this version (v1.8.70), built from the merged commit for x86
  # and 64-bit ARM and pushed as ghcr.io/<owner>/<repo>:<version>. Not `latest`:
  # that moves only when a release is marked Latest (latest.yml), so a merge —
  # still a pre-release — never reaches anyone pulling latest.
  #
  # After the release job, and skipped when this version's image is already
  # there, so re-running the workflow (or a docs-only merge, which leaves the
  # version alone) never rebuilds it — and a build that failed is simply made
  # on the next run. The version is read again here rather than passed from the
  # release job: pre-flight step 5 allows only the contexts this file uses.
  image:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Version and image name
        id: v
        run: |
          echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Is this version already published?
        id: have
        run: |
          if docker buildx imagetools inspect "${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
        if: steps.have.outputs.exists == 'false'

      - uses: docker/setup-buildx-action@v3
        if: steps.have.outputs.exists == 'false'

      - name: Build and push the version image
        if: steps.have.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            MUSICD_IMAGE=${{ steps.v.outputs.image }}
          tags: ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=MusicD Remote
            org.opencontainers.image.description=A companion for Roon
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
          cache-from: type=gha
          # A cache that fails to save must not fail the image it was saving.
          cache-to: type=gha,mode=max,ignore-error=true
