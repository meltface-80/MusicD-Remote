name: Create Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(jq -r .version package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Check if release already exists
        id: check
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" --repo ${{ github.repository }} > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build tarball
        id: tarball
        if: steps.check.outputs.exists == 'false'
        run: |
          VERSION=${{ steps.version.outputs.version }}
          TARBALL="/tmp/MusicD-Remote-v${VERSION}.tar.gz"
          tar -czf "$TARBALL" \
            --exclude='./.git' \
            --exclude='./node_modules' \
            --exclude='./old' \
            --exclude='./data' \
            --exclude='./*.tar.gz' \
            .
          echo "path=$TARBALL" >> $GITHUB_OUTPUT

      - name: Extract changelog section
        id: notes
        if: steps.check.outputs.exists == 'false'
        run: |
          VERSION=${{ steps.version.outputs.version }}
          # Print the lines BETWEEN this version's "## [x.y.z]" heading and the
          # next "## [" heading. The previous awk range (/^## \[$VERSION\]/,/^## \[/)
          # always returned just the heading itself — a range whose end pattern
          # also matches its start line collapses to that single line — which the
          # head/tail trim then reduced to nothing, so every release shipped with
          # empty notes. index($0,...)==1 anchors the match without the version's
          # dots being treated as regex wildcards.
          NOTES=$(awk -v ver="$VERSION" '
            !found && index($0, "## [" ver "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;};/\n$/ba')
          if [ -z "$NOTES" ]; then
            NOTES="See CHANGELOG.md for the changes in v$VERSION."
          fi
          # Written to a FILE, not a step output interpolated into the release
          # command: changelog entries contain backticks (`search`, `docker logs`),
          # which a double-quoted --notes "${{ ... }}" would execute as command
          # substitution. --notes-file passes the text through untouched.
          printf '%s\n' "$NOTES" > /tmp/release-notes.md
          echo "--- release notes ---"; cat /tmp/release-notes.md

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          TARBALL="${{ steps.tarball.outputs.path }}"
          if [ -n "$TARBALL" ] && [ -f "$TARBALL" ]; then
            gh release create "$TAG" "$TARBALL" \
              --title "MusicD Remote $TAG" \
              --notes-file /tmp/release-notes.md \
              --prerelease
          else
            gh release create "$TAG" \
              --title "MusicD Remote $TAG" \
              --notes-file /tmp/release-notes.md \
              --prerelease
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
